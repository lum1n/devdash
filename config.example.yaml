# Copy to ~/.config/devdash/config.yaml
# Env: DEVDASH_CONFIG, DEVDASH_LISTEN, DEVDASH_ROOTS, DEVDASH_WORKSPACE

listen: 127.0.0.1:8789
active: private
workspaces:
  - id: work
    name: work
    roots:
      - /home/you/work
  - id: private
    name: private
    roots:
      - /home/you/repos
  - id: private-remote
    name: private remote
    kind: ssh
    host: you@box
    url: 127.0.0.1:8790          # local side of ssh -L (this machine)
    listen: 127.0.0.1:8789       # where remote `devdash serve` binds (the box)
ignore:
  - references
  - node_modules
actions:
  editor: nvim
  term: tmux
